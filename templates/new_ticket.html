{% extends "base.html" %}


{% block content %}


<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="mb-4">

            <h1>
                Create Support Ticket
            </h1>

            <p class="text-muted">
                Submit a new technical support issue.
            </p>

        </div>


        {% if error %}

            <div
                class="alert alert-danger"
                role="alert"
            >
                {{ error }}
            </div>

        {% endif %}


        <div class="card shadow-sm">

            <div class="card-body">

                <form
                    method="POST"
                    action="/tickets/new"
                >


                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label"
                        >
                            Ticket Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            value="{{ request.form.get('title', '') }}"
                            placeholder="Example: Unable to connect to VPN"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="description"
                            class="form-label"
                        >
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="Describe the technical issue..."
                            required
                        >{{ request.form.get('description', '') }}</textarea>

                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label
                                for="category"
                                class="form-label"
                            >
                                Category
                            </label>

                            <select
                                class="form-select"
                                id="category"
                                name="category"
                                required
                            >

                                <option value="">
                                    Select category
                                </option>


                                {% for category in categories %}

                                    <option
                                        value="{{ category }}"
                                        {% if request.form.get('category') == category %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ category }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="priority"
                                class="form-label"
                            >
                                Priority
                            </label>

                            <select
                                class="form-select"
                                id="priority"
                                name="priority"
                                required
                            >

                                <option value="">
                                    Select priority
                                </option>


                                {% for priority in priorities %}

                                    <option
                                        value="{{ priority }}"
                                        {% if request.form.get('priority') == priority %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ priority }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                    </div>


                    <div class="mb-4">

                        <label
                            for="submitted_by"
                            class="form-label"
                        >
                            Submitted By
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="submitted_by"
                            name="submitted_by"
                            value="{{ request.form.get('submitted_by', '') }}"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create Ticket
                        </button>

                        <a
                            href="/tickets"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>


                </form>

            </div>

        </div>

    </div>

</div>


{% endblock %}
