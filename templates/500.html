{% extends "base.html" %}


{% block content %}

{# Recovery page for unexpected errors, returned with HTTP 500 without exposing internal details. #}


<div class="error-page">

    <div class="error-code">
        500
    </div>

    <h1>
        Something Went Wrong
    </h1>

    <p class="text-muted">

        HelpDesk Lite encountered an unexpected error while processing the request.

    </p>


    <div class="d-flex justify-content-center gap-2 flex-wrap">

        <a
            href="/"
            class="btn btn-primary"
        >
            Dashboard
        </a>

        <a
            href="/tickets"
            class="btn btn-outline-secondary"
        >
            View Tickets
        </a>

    </div>

</div>


{% endblock %}
